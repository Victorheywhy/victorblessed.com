<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Background Preview 2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;font-family:'Inter',sans-serif;padding:2rem;display:grid;grid-template-columns:1fr 1fr;gap:2rem;}
.card{position:relative;width:100%;height:220px;border-radius:16px;overflow:hidden;border:1px solid #1a3a1a;display:flex;align-items:center;justify-content:center;background:#060f06;}
.label{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#fff;font-size:0.85rem;font-weight:600;letter-spacing:.06em;z-index:10;text-shadow:0 1px 6px #000;}
.num{position:absolute;top:12px;left:16px;color:#22c55e;font-size:0.7rem;font-weight:700;letter-spacing:.1em;z-index:10;}
canvas{position:absolute;inset:0;width:100%;height:100%;}
</style>
</head>
<body>

<!-- Option 8: Matrix Rain -->
<div class="card">
  <canvas id="cv8"></canvas>
  <span class="num">OPTION 8</span>
  <span class="label">Matrix Code Rain</span>
</div>

<!-- Option 9: Hexagon Honeycomb -->
<div class="card">
  <canvas id="cv9"></canvas>
  <span class="num">OPTION 9</span>
  <span class="label">Hexagon Honeycomb</span>
</div>

<!-- Option 10: Circuit Board -->
<div class="card">
  <canvas id="cv10"></canvas>
  <span class="num">OPTION 10</span>
  <span class="label">Circuit Board Traces</span>
</div>

<!-- Option 11: Neon Rings -->
<div class="card">
  <canvas id="cv11"></canvas>
  <span class="num">OPTION 11</span>
  <span class="label">Neon Expanding Rings</span>
</div>

<!-- Option 12: Constellation -->
<div class="card">
  <canvas id="cv12"></canvas>
  <span class="num">OPTION 12</span>
  <span class="label">Constellation Map</span>
</div>

<!-- Option 13: DNA Helix -->
<div class="card">
  <canvas id="cv13"></canvas>
  <span class="num">OPTION 13</span>
  <span class="label">DNA Helix</span>
</div>

<!-- Option 14: Smoke Wisps — full width -->
<div class="card" style="grid-column:span 2;">
  <canvas id="cv14"></canvas>
  <span class="num">OPTION 14</span>
  <span class="label">Smoke / Fog Wisps</span>
</div>

<script>
// ── OPTION 8: Matrix Code Rain ──────────────────────────────────
(function(){
  const cv=document.getElementById('cv8'),ctx=cv.getContext('2d');
  const w=cv.width=cv.parentElement.offsetWidth,h=cv.height=cv.parentElement.offsetHeight;
  const cols=Math.floor(w/14);
  const drops=Array(cols).fill(1);
  const chars='01アイウエオカキクケコサシスセソタチツテトナニヌネノ';
  function draw(){
    ctx.fillStyle='rgba(6,15,6,0.18)';ctx.fillRect(0,0,w,h);
    ctx.fillStyle='#22c55e';ctx.font='12px monospace';
    drops.forEach((y,i)=>{
      const c=chars[Math.floor(Math.random()*chars.length)];
      ctx.fillStyle=y===1?'#bbf7d0':'#22c55e';
      ctx.fillText(c,i*14,y*14);
      if(y*14>h&&Math.random()>0.975)drops[i]=0;
      drops[i]++;
    });
  }
  setInterval(draw,45);
})();

// ── OPTION 9: Hexagon Honeycomb ─────────────────────────────────
(function(){
  const cv=document.getElementById('cv9'),ctx=cv.getContext('2d');
  const w=cv.width=cv.parentElement.offsetWidth,h=cv.height=cv.parentElement.offsetHeight;
  const R=22;let t=0;
  function hex(cx,cy,r,alpha){
    ctx.beginPath();
    for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));}
    ctx.closePath();
    ctx.strokeStyle=`rgba(34,197,94,${alpha})`;ctx.lineWidth=.8;ctx.stroke();
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    const cols=Math.ceil(w/(R*1.73))+2,rows=Math.ceil(h/(R*1.5))+2;
    for(let row=-1;row<rows;row++){
      for(let col=-1;col<cols;col++){
        const cx=col*R*1.73+(row%2)*R*.865;
        const cy=row*R*1.5;
        const pulse=Math.sin(t*.03+col*.4+row*.3)*.5+.5;
        hex(cx,cy,R-2,0.08+pulse*.22);
      }
    }
    t++;requestAnimationFrame(draw);
  }draw();
})();

// ── OPTION 10: Circuit Board ────────────────────────────────────
(function(){
  const cv=document.getElementById('cv10'),ctx=cv.getContext('2d');
  const w=cv.width=cv.parentElement.offsetWidth,h=cv.height=cv.parentElement.offsetHeight;
  const grid=30;
  // build random circuit paths
  const paths=[];
  for(let i=0;i<18;i++){
    let x=Math.floor(Math.random()*(w/grid))*grid;
    let y=Math.floor(Math.random()*(h/grid))*grid;
    const pts=[{x,y}];
    for(let s=0;s<6;s++){
      const dir=Math.floor(Math.random()*4);
      const steps=(Math.floor(Math.random()*4)+1)*grid;
      if(dir===0)x=Math.min(w,x+steps);
      else if(dir===1)x=Math.max(0,x-steps);
      else if(dir===2)y=Math.min(h,y+steps);
      else y=Math.max(0,y-steps);
      pts.push({x,y});
    }
    paths.push({pts,progress:Math.random(),speed:0.003+Math.random()*.004});
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    paths.forEach(p=>{
      p.progress=(p.progress+p.speed)%1;
      // draw full path dimly
      ctx.beginPath();ctx.moveTo(p.pts[0].x,p.pts[0].y);
      p.pts.forEach(pt=>ctx.lineTo(pt.x,pt.y));
      ctx.strokeStyle='rgba(34,197,94,0.08)';ctx.lineWidth=1;ctx.stroke();
      // draw moving pulse
      const totalPts=p.pts.length-1;
      const segIdx=Math.floor(p.progress*totalPts);
      const segFrac=(p.progress*totalPts)%1;
      if(segIdx<totalPts){
        const a=p.pts[segIdx],b=p.pts[segIdx+1];
        const px=a.x+(b.x-a.x)*segFrac,py=a.y+(b.y-a.y)*segFrac;
        const g=ctx.createRadialGradient(px,py,0,px,py,12);
        g.addColorStop(0,'rgba(34,197,94,0.9)');g.addColorStop(1,'rgba(34,197,94,0)');
        ctx.beginPath();ctx.arc(px,py,12,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
        ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fillStyle='#86efac';ctx.fill();
      }
      // nodes
      p.pts.forEach(pt=>{
        ctx.beginPath();ctx.arc(pt.x,pt.y,2.5,0,Math.PI*2);
        ctx.fillStyle='rgba(34,197,94,0.25)';ctx.fill();
      });
    });
    requestAnimationFrame(draw);
  }draw();
})();

// ── OPTION 11: Neon Expanding Rings ────────────────────────────
(function(){
  const cv=document.getElementById('cv11'),ctx=cv.getContext('2d');
  const w=cv.width=cv.parentElement.offsetWidth,h=cv.height=cv.parentElement.offsetHeight;
  const rings=Array.from({length:6},(_,i)=>({r:i*(Math.max(w,h)/6),alpha:1-i/6}));
  let t=0;
  function draw(){
    ctx.clearRect(0,0,w,h);
    rings.forEach(ring=>{
      ring.r+=0.6;ring.alpha-=0.004;
      if(ring.r>Math.max(w,h)*.8||ring.alpha<=0){ring.r=0;ring.alpha=0.6;}
      ctx.beginPath();ctx.arc(w/2,h/2,ring.r,0,Math.PI*2);
      ctx.strokeStyle=`rgba(34,197,94,${ring.alpha})`;
      ctx.lineWidth=1.5;ctx.stroke();
    });
    // centre glow
    const g=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,60);
    g.addColorStop(0,'rgba(34,197,94,0.15)');g.addColorStop(1,'rgba(34,197,94,0)');
    ctx.beginPath();ctx.arc(w/2,h/2,60,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    t++;requestAnimationFrame(draw);
  }draw();
})();

// ── OPTION 12: Constellation ────────────────────────────────────
(function(){
  const cv=document.getElementById('cv12'),ctx=cv.getContext('2d');
  const w=cv.width=cv.parentElement.offsetWidth,h=cv.height=cv.parentElement.offsetHeight;
  const stars=Array.from({length:70},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5+.3,twinkle:Math.random()*Math.PI*2}));
  const conns=[];
  stars.forEach((s,i)=>{stars.slice(i+1).forEach((t2,j)=>{
    const dx=s.x-t2.x,dy=s.y-t2.y;
    if(Math.sqrt(dx*dx+dy*dy)<70)conns.push([i,i+1+j]);
  });});
  let t=0;
  function draw(){
    ctx.clearRect(0,0,w,h);
    conns.forEach(([a,b])=>{
      ctx.beginPath();ctx.moveTo(stars[a].x,stars[a].y);ctx.lineTo(stars[b].x,stars[b].y);
      ctx.strokeStyle='rgba(34,197,94,0.12)';ctx.lineWidth=.6;ctx.stroke();
    });
    stars.forEach(s=>{
      const alpha=.4+Math.sin(t*.04+s.twinkle)*.35;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(200,255,210,${alpha})`;ctx.fill();
    });
    t++;requestAnimationFrame(draw);
  }draw();
})();

// ── OPTION 13: DNA Helix ────────────────────────────────────────
(function(){
  const cv=document.getElementById('cv13'),ctx=cv.getContext('2d');
  const w=cv.width=cv.parentElement.offsetWidth,h=cv.height=cv.parentElement.offsetHeight;
  let t=0;
  function draw(){
    ctx.clearRect(0,0,w,h);
    const amp=35,freq=0.045,numStrands=3;
    for(let s=0;s<numStrands;s++){
      const offX=s*(w/numStrands)+w/(numStrands*2);
      for(let y=0;y<h;y+=2){
        const x1=offX+Math.sin(y*freq+t*.04)*amp;
        const x2=offX+Math.sin(y*freq+t*.04+Math.PI)*amp;
        const alpha=0.6+Math.sin(y*freq+t*.04)*.3;
        ctx.beginPath();ctx.arc(x1,y,1.5,0,Math.PI*2);
        ctx.fillStyle=`rgba(34,197,94,${alpha})`;ctx.fill();
        ctx.beginPath();ctx.arc(x2,y,1.5,0,Math.PI*2);
        ctx.fillStyle=`rgba(74,222,128,${alpha})`;ctx.fill();
        // rungs every 18px
        if(y%18===0){
          ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);
          ctx.strokeStyle=`rgba(34,197,94,0.2)`;ctx.lineWidth=1;ctx.stroke();
        }
      }
    }
    t++;requestAnimationFrame(draw);
  }draw();
})();

// ── OPTION 14: Smoke Wisps ──────────────────────────────────────
(function(){
  const cv=document.getElementById('cv14'),ctx=cv.getContext('2d');
  const w=cv.width=cv.parentElement.offsetWidth,h=cv.height=cv.parentElement.offsetHeight;
  const particles=Array.from({length:80},()=>({
    x:Math.random()*w,y:h+Math.random()*h,
    vx:(Math.random()-.5)*.4,vy:-(Math.random()*.8+.3),
    life:Math.random(),decay:0.003+Math.random()*.003,
    size:20+Math.random()*40
  }));
  function draw(){
    ctx.clearRect(0,0,w,h);
    particles.forEach(p=>{
      p.x+=p.vx+Math.sin(p.life*3)*.3;p.y+=p.vy;p.life-=p.decay;p.size+=.3;
      if(p.life<=0||p.y<-80){
        p.x=Math.random()*w;p.y=h+20;p.life=0.8+Math.random()*.2;
        p.size=20+Math.random()*30;p.vx=(Math.random()-.5)*.4;p.vy=-(Math.random()*.8+.3);
      }
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size);
      g.addColorStop(0,`rgba(34,197,94,${p.life*.08})`);
      g.addColorStop(1,'rgba(34,197,94,0)');
      ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fillStyle=g;ctx.fill();
    });
    requestAnimationFrame(draw);
  }draw();
})();
</script>
</body>
</html>
