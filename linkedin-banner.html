<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1584" />
  <title>LinkedIn Banner — Victor Blessed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,600;1,700;1,900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1584px;
      height: 396px;
      overflow: hidden;
      background: #000;
    }


    .banner {
      width: 1584px;
      height: 396px;
      background: #080808;
      position: relative;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    /* ── Subtle grid overlay ── */
    .banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,200,80,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,200,80,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Green glow top-left ── */
    .glow-tl {
      position: absolute;
      top: -120px;
      left: -80px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0,200,80,0.18) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Green glow bottom-right ── */
    .glow-br {
      position: absolute;
      bottom: -100px;
      right: 300px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(0,200,80,0.10) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Vertical green accent line ── */
    .accent-line {
      position: absolute;
      left: 340px;
      top: 0;
      width: 1px;
      height: 100%;
      background: linear-gradient(to bottom, transparent, rgba(0,200,80,0.5) 30%, rgba(0,200,80,0.5) 70%, transparent);
      z-index: 1;
    }

    /* ── Left section: Logo ── */
    .left {
      position: relative;
      z-index: 2;
      width: 340px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0 32px;
    }

    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      line-height: 1;
    }

    .logo-top {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 700;
      font-size: 52px;
      color: #fff;
      letter-spacing: 1px;
    }

    .logo-top .v {
      color: #00c850;
    }

    .logo-bar {
      width: 100%;
      height: 2px;
      background: linear-gradient(to right, transparent, #00c850, transparent);
      margin: 6px 0;
    }

    .logo-bottom {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 600;
      font-size: 32px;
      color: rgba(255,255,255,0.75);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .logo-bottom .b {
      color: #00c850;
    }

    /* ── Centre section: Info ── */
    .centre {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 48px 0 56px;
      gap: 18px;
    }

    .title-tag {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #00c850;
    }

    .main-title {
      font-family: 'Inter', sans-serif;
      font-size: 30px;
      font-weight: 700;
      color: #fff;
      line-height: 1.25;
      max-width: 620px;
    }

    .main-title span {
      color: #00c850;
    }

    .divider {
      width: 60px;
      height: 2px;
      background: #00c850;
      border-radius: 2px;
    }

    .info-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: rgba(255,255,255,0.7);
    }

    .info-icon {
      color: #00c850;
      flex-shrink: 0;
    }

    .socials-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 2px;
    }

    .social-handle {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: rgba(255,255,255,0.55);
    }

    .social-handle svg {
      color: #00c850;
    }

    .dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
    }

    /* ── Right section: Photo ── */
    .right {
      position: relative;
      z-index: 2;
      width: 420px;
      height: 100%;
      flex-shrink: 0;
      overflow: hidden;
      background: #c8c8c8;
    }

    /* Fade gradient on left edge — dark bg bleeds over photo */
    .right::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 90px;
      height: 100%;
      background: linear-gradient(to right, #080808, transparent);
      z-index: 3;
    }

    /* Fade gradient on right edge */
    .right::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 50px;
      height: 100%;
      background: linear-gradient(to left, #080808, transparent);
      z-index: 3;
    }

    .photo {
      width: 100%;
      height: 130%;
      object-fit: cover;
      object-position: center 0%;
      filter: grayscale(100%) contrast(1.1) brightness(1.3);
      display: block;
      margin-top: -15%;
    }

    /* Green bottom border accent */
    .bottom-border {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(to right, transparent, #00c850 20%, #00c850 80%, transparent);
      z-index: 10;
    }
  </style>
</head>
<body>

</body>
